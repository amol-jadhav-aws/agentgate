# Deploy: GitHub OIDC -> IAM role (trust scoped to this repo and branch) -> Terraform apply -> ECS rollout.
# No long-lived AWS keys anywhere. dev deploys on push to main; prod on a v* tag after the eval gate ran in aws mode.
name: deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    # Skipped until AWS is set up: add the repo variable AWS_DEPLOY_ROLE_ARN.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: agentgate-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/agentgate:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.5" }
      - name: Terraform apply
        working-directory: infra/terraform/envs/${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -var "image=$IMAGE"
      - name: Real-model evaluation gate (aws mode)
        env:
          AGENTGATE_MODE: aws
          AGENTGATE_DYNAMODB_TABLE: agentgate-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
        run: |
          pip install -e .
          agentgate-eval --report .evals/aws
      - uses: actions/upload-artifact@v4
        with: { name: eval-report-aws, path: .evals/aws }
