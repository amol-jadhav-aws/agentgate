[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "AgentGate: a governed agent platform on AWS. Inference gateway, tool/MCP gateway, policy-as-code, human approval, evaluation gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amol Jadhav" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "boto3>=1.34",
  "redis>=5.0",
  "cedarpy>=4.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=1.0",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp-proto-http>=1.24",
  "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9", "moto[dynamodb]>=5.0"]

[project.scripts]
agentgate = "agentgate.agents.cli:main"
agentgate-eval = "agentgate.evals.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # long prompt strings are fine; the formatter handles the rest
